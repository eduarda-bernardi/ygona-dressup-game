<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <meta property="og:title" content="Ygona DressUp Game">
    <meta property="og:description" content="Monte um look perfeito pra uma noite de aglomeração com sucesso em Ygona DressUp Game! Por: DudaEletrohits ©">
    <meta property="og:image" content="https://res.cloudinary.com/xzqr9e7s/image/upload/v1785713103/mini-1x91x1_hfpy7m.jpg">

    <link rel="shortcut icon" href="assets/imagens/main/miniaturas/heart.webp" type="image/x-icon" />

    <title>Ygona DressUp</title>
    <meta name="description" content="Monte um look perfeito pra uma noite de aglomeração com sucesso em Ygona DressUp Game! Por: DudaEletrohits ©">
    <style>
        html, body{
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #fa83b1;
            overflow: hidden;
        }

        #content{
            width: 100vw;
            height: 100vh;
            background-color: #fa83b1; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game{
            position: relative;
            width: 100%;
            aspect-ratio: 2/1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-canvas{
            display: block;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            margin: 0 auto;
            max-width: 100vw;
            max-height: 100vh;
        }

        #nome{
            display: none;
            width: 18%;
            height: 5%;
            position: absolute;
            top: 70%;
            left: 68%;
            border-radius: 40px;
            padding: 0.8%;
            border: 0.4vw solid #54aad4;
            border-left: 0.8vw solid #54aad4;
            border-bottom: 0.5vw solid #54aad4;
            background-color: #effaff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 700;
            font-size: 1.4vw;
            color: #e771b2;
            text-align: center;
        }

        #nome, .cursor-customizado{
            cursor: none!important;
        }

        #nome::placeholder{
            color: #83b3fa;
            text-shadow: none;
        }

        #nome:focus{
            background-color: #fff3fa;
            border-color: #d5539b;
            outline: none;
            box-shadow: 0 0 7px rgba(255, 255, 255, 0.5);
        }

        #aviso-orientacao {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #fa83b1;
            z-index: 99999;
            color: #FFFFFF;
            font-family: sans-serif;
        }

        .conteudo-aviso {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            text-align: center;
            padding: 8vw;
            box-sizing: border-box;
        }

        .icone-girar {
            width: 25vw;
            aspect-ratio: 1/1;
            background: url(assets/imagens/main/inicio/rotate.webp);
            background-position: center;
            background-repeat: no-repeat;
            background-size: contain;
            margin-bottom: 5vh;
            animation: girarCelular 2s infinite ease-in-out;
        }

        .conteudo-aviso p {
            font-size: 5vw;
            font-weight: bold;
            color: #ffffff;
        }

        @keyframes girarCelular {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
            100% { transform: rotate(0deg); }
        }


        @media screen and (max-width: 1024px) and (orientation: portrait) {
            #aviso-orientacao {
                display: flex;
            }
        }

    </style>
</head>
<body>
    <div id="aviso-orientacao">
    <div class="conteudo-aviso">
        <div class="icone-girar"></div>
        <p>Por favor, deixe a tela na horizontal para jogar!</p>
    </div>
</div>
    <div id="content">
        <div id="game">
            <canvas id="game-canvas"></canvas>
            <input type="text" id="nome" placeholder="★ digite seu nome ★">
        </div>
    </div>
    <script src="js/compressed.js"></script>
</body>
</html>
